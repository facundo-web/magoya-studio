       Manrope 800 convertida a CURVAS (opentype.js sobre el woff real de la
       app): un <text> adentro de un <img> no carga la webfont y el export
       caería a fallback. Dos niveles: "AI" con las rayitas de énfasis y
       "en Campo" limpio debajo. Ya NO dice "por Magoya" (ronda 2: el
       wordmark oficial vive arriba de cada placa y repetirlo era
       redundante) y ya NO lleva el doble subrayado bajo el "en" (ronda 3:
       "al logo sacale las líneas debajo del 'en'" — las rayitas del "AI"
       quedan). La I va dibujada aparte con kerning óptico (Manrope 800 la
       separa de más a tamaño grande).
       Color FIJO a propósito (variantes tinta/crema, como los wordmarks):
       un logo no se tiñe con el acento. -->
