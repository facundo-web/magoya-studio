  <!-- Badge "EN VIVO" estilo streaming: pill maciza con el puntito y el texto
       CALADOS (fill-rule evenodd, un solo path). Un solo color a propósito:
       así entra al pipeline de teñido de los trazos (currentColor →
       coloredIcon) y se pinta del acento o de lo que elijan, sin degradés
       ni segundos colores que el motor no sabe recolorear. Las letras están
       dibujadas como polígonos (E N V I V O son geometría simple) porque un
       <text> adentro de un <img> no carga la Manrope. -->
