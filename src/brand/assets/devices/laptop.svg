<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336">
  <defs>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E6E9"/><stop offset=".55" stop-color="#C4C7CB"/><stop offset="1" stop-color="#9EA2A7"/>
    </linearGradient>
    <linearGradient id="lidedge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6065"/><stop offset=".5" stop-color="#33373B"/><stop offset="1" stop-color="#4C5156"/>
    </linearGradient>
  </defs>
  <!-- Tapa: canto metálico. Va como ANILLO (evenodd), no como rectángulo
       lleno: relleno tapaba justo el hueco de la pantalla que abre el
       cuerpo de abajo, así que la foto de la notebook no se veía nunca.
       El agujero interno calca el contorno externo del cuerpo negro. -->
  <path fill-rule="evenodd" fill="url(#lidedge)"
        d="M70,0 H490 A18,18 0 0 1 508,18 V292 A18,18 0 0 1 490,310 H70 A18,18 0 0 1 52,292 V18 A18,18 0 0 1 70,0 Z
           M70,4 H490 A14,14 0 0 1 504,18 V292 A14,14 0 0 1 490,306 H70 A14,14 0 0 1 56,292 V18 A14,14 0 0 1 70,4 Z"/>
  <!-- cuerpo negro con el HUECO de la pantalla (evenodd): la foto se ve adentro -->
  <path fill-rule="evenodd" fill="#17191C" d="M70,4 H490 A14,14 0 0 1 504,18 V292 A14,14 0 0 1 490,306 H70 A14,14 0 0 1 56,292 V18 A14,14 0 0 1 70,4 Z M80,18 H480 A2,2 0 0 1 482,20 V290 A2,2 0 0 1 480,292 H80 A2,2 0 0 1 78,290 V20 A2,2 0 0 1 80,18 Z"/>
  <circle cx="280" cy="11" r="2.6" fill="#2E3237"/>
  <!-- bisagra -->
  <rect x="212" y="306" width="136" height="5" rx="2.5" fill="#6C7176"/>
  <!-- base: cuña con labio frontal y muesca de apertura -->
  <path d="M40,310 H520 L552,329 Q560,334 550,334 H10 Q0,334 8,329 Z" fill="url(#deck)"/>
  <path d="M48,313 H512 L536,328 H24 Z" fill="#F1F3F5"/>
  <path d="M246,313 H314 A7,7 0 0 1 307,320 H253 A7,7 0 0 1 246,313 Z" fill="#BCC0C4"/>
</svg>
